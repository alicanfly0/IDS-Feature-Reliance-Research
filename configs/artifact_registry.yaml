# Problems with whole flows, labels or the generation process. They have no single column, so they
# are NOT part of ARR@K; they bound what any feature-level analysis can conclude.
non_feature_issues:
  - id: F01
    name: TCP appendix flows
    evidence_level: direct_extraction_error
    target: flow
    mechanism: CICFlowMeter ends a TCP flow at the first FIN; the rest of the connection becomes separate meaningless flows (and timed-out flows split similarly).
    sources:
      - {ref: engelen2021, section: "III-A Flow construction", page: 3, finding: "TCP appendices make up 25.9 percent of the entire dataset"}
    d008_relevance: "Engelen's regenerated Friday file has 95,123 DDoS flows vs 128,027 in this release (25.7% fewer); rows cannot be mapped one to one (D-005)"
  - id: F02
    name: RST not terminating flows
    evidence_level: direct_extraction_error
    target: flow
    mechanism: RST packets were not treated as flow termination.
    sources:
      - {ref: engelen2021, section: "III-A Flow construction (3) Ignoring RST", page: 3, finding: "RST should be a valid way to terminate a TCP flow"}
  - id: F03
    name: Swapped flow direction
    evidence_level: direct_extraction_error
    target: flow
    mechanism: Timed-out appendices and misordered frames can make a flow's source and destination swapped, which also swaps port-dependent features.
    sources:
      - {ref: engelen2021, section: "III-A Flow construction", page: 3, finding: "Source and Destination features of the flow are swapped"}
      - {ref: lanvin2023, section: "3.1 CICFlowMeter issue with misordered packets", page: "6-7", finding: "Friday capture: 7,094 misordered frames (0.071%)"}
    d008_relevance: "3 DDoS flows with ephemeral destination ports would be consistent with swapped direction (unverified)"
  - id: F04
    name: Duplicated capture packets
    evidence_level: direct_extraction_error
    target: generation_process
    mechanism: Packets duplicated in the capture distort counts, rates and inter-arrival times (R09-R12 are the features shown).
    sources:
      - {ref: lanvin2023, section: "3.3 Dealing with data duplication", page: "8-9", finding: "4.5% of packets per day duplicated"}
  - id: L01
    name: Attempted attacks labelled as attacks
    evidence_level: direct_extraction_error
    target: label
    mechanism: Payload-less attack attempts carry the attack label.
    sources:
      - {ref: engelen2021, section: "III-B.2 Attempted attack flows", page: 3, finding: "attack flows without payload labelled as successful attacks"}
    d008_relevance: "Engelen lists 0 attempted DDoS flows: little relevance to the D-008 scope"
  - id: L02
    name: Unlabelled port scan
    evidence_level: direct_extraction_error
    target: label
    mechanism: A port scan during the Thursday infiltration was not labelled.
    sources:
      - {ref: lanvin2023, section: "3.4 Attack omission", page: 9, finding: "port scan flows missing from the official labels"}
    d008_relevance: "Thursday capture: outside the D-008 scope"
  - id: I01
    name: Flow identifiers
    evidence_level: unverified_hypothesis
    target: feature
    mechanism: Flow ID, IPs, source port and timestamp could let a model tie hosts or time windows to classes.
    sources:
