# Project-wide defaults, read by src/config.py and overlaid by one file from
# configs/experiments/. Dataset provenance lives in configs/datasets.yaml.
# No model hyperparameters are defined here yet: they are added per baseline in
# Milestone 1, each value traced to its source paper or marked as our own choice.

paths:
  raw: data/raw
  processed: data/processed
  results: results

seed: 42  # global default; experiments must also record their own seed list

split:
  # Strategy is chosen per experiment (docs/decision_log.md D-007).
  # "stratified_random" is NOT a universal default.
  fractions: {train: 0.70, val: 0.15, test: 0.15}  # Phase II proposal, pending D-007

preprocessing:
  # All fitted statistics come from the training partition only. These are the
  # only values the code implements; src/config.py rejects anything else.
  inf_as_missing: true
  impute: median
  scale: minmax
  drop_constant_on_train: true
  clip_to_train_range: false   # keep out-of-range test values visible
  one_hot_unknown: ignore      # unseen categories encode as all-zeros
