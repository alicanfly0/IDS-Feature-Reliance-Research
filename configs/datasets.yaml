        - training-set 42.4% and testing-set 34.5% rows duplicate another row once id is ignored
        - '8,541 testing-set rows (10.4%) have an exact content twin in the training set; 49% of DoS test rows have a training twin, mostly labelled as another class (Exploits, Backdoor, Analysis ...)'
