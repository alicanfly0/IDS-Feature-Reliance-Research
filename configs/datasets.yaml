# Dataset acquisition manifest (Milestone 0).
#
# Rules:
#  - Only the official source listed here may be used. Mirrors (Kaggle, Hugging
#    Face, GitHub re-uploads) and alternative "corrected" versions are NOT
#    substitutes. Any change of source is a decision-log entry first.
#  - `null` means unknown. Every value carries its evidence in `source` /
#    `confirmed`. "UNCONFIRMED" values must be checked against downloaded files.
#  - sha256 fields are filled from our own download (python -m src.data.manifest
#    --hash) and are then the reference for every later run. Publishers did not
#    post checksums on the pages checked on 2026-11-07.
#  - Nothing has been downloaded. status: not_acquired for every entry.
#
# Web pages were checked on 2026-11-07. Paper facts cite PDFs in ../project/
# (physical page numbers) as audited in CNET_FULL_PAPER_AUDIT.md.

manifest_version: 1
checked_on: 2026-11-07

datasets:

  # ---------------------------------------------------------------------------
  cicids2017_original:
    name: CIC-IDS2017 (original CICFlowMeter CSV release)
    status: not_acquired
    local_dir: data/raw/cicids2017_original
    publisher: Canadian Institute for Cybersecurity, University of New Brunswick
    official_source:
      landing_page: https://www.unb.ca/cic/datasets/ids-2017.html
      download: http://cicresearch.ca/CICDataset/CIC-IDS-2017/
      access_notes: >
        Download page is a registration form (name, email, organization,
        country). On 2026-11-07 it returned "Server error. Please try again
        later." and showed no file list. Plain http, not https.
    version: null  # no version identifier or DOI published on the landing page
    files:
      - name: MachineLearningCSV.zip
        purpose: CICFlowMeter features + label, identifiers removed (expected)
        size_bytes: null
        sha256: null
        confirmed: name only (landing page)
      - name: GeneratedLabelledFlows.zip
        purpose: labelled flows incl. Flow ID / IPs / ports / timestamp (expected)
        size_bytes: null
        sha256: null
        confirmed: name only (landing page)
      - name: PCAPs (per day)
        purpose: NOT planned for download; needed only if we re-extract flows
        size_note: "Landing page table 'Size (GB)': Mon 11.0, Tue 11, Wed 13, Thu 7.8, Fri 8.3 (not stated whether PCAP-only)"
        sha256: null
        confirmed: per-day sizes only
    license: >
      No named license. Page says the dataset is publicly available for
      researchers and users should cite the related paper. Redistribution terms
      UNCONFIRMED: do not re-host.
    citation: >
      I. Sharafaldin, A. H. Lashkari, A. A. Ghorbani, "Toward Generating a New
      Intrusion Detection Dataset and Intrusion Traffic Characterization",
      ICISSP 2018.
    records:
      value: null
      notes: >
        Phase II states 2.83 million flows / 15 classes and attributes it to [1];
        [1] actually uses a 225,745-row DDoS subset (Nezhadsistani p.5). Total
        must be measured from the files.
    feature_schema:
      count: null
      source: landing page says "more than 80 network flow features"
      paper_reported:
        - "Nezhadsistani et al. [1]: 78 features + label in the DDoS subset (Table 3)"
      expected_quirks_to_verify:
        - leading/trailing whitespace in column names
        - a duplicated "Fwd Header Length" column
        - '"Infinity" / NaN values in Flow Bytes/s and Flow Packets/s'
        - non-UTF-8 byte in "Web Attack" label strings
      identifier_fields_expected: [Flow ID, Source IP, Source Port, Destination IP, Timestamp]
      confirmed: false
    labeling:
      columns: null  # expected a "Label" column; exact name UNCONFIRMED
      classes_from_landing_page: >
        BENIGN plus Brute Force FTP/SSH, DoS (slowloris, Slowhttptest, Hulk,
        GoldenEye), Heartbleed, Web Attack (Brute Force, XSS, SQL Injection),
        Infiltration, Botnet (ARES), PortScan, DDoS (LOIT)
      known_label_issues: >
        Engelen 2021 [10]: TCP appendices (25.9% of flows), over-broad labels,
        payload-less "attempted" attacks labelled as attacks. Lanvin 2023 [11]:
        ~5% duplicated packets, port scan during Thursday infiltration unlabelled.
    split_policy: undecided  # see docs/decision_log.md D-007
    intended_experiments:
      - R1 full-feature baselines (AE-XGBoost scope per D-008)
      - R2 metadata-stripped and R3 extraction-bug-stripped retrained ablations
      - SHAP + ARR@K attribution audit
      - R4a source domain for train-original / test-corrected evaluation (D-005)

  # ---------------------------------------------------------------------------
  cicids2017_engelen_wtmc2021:
    name: CICIDS2017 regenerated by Engelen, Rimmer & Joosen (WTMC 2021)
    status: not_acquired
    local_dir: data/raw/cicids2017_engelen_wtmc2021
    publisher: DistriNet, KU Leuven
    official_source:
      landing_page: https://intrusion-detection.distrinet-research.be/WTMC2021/
      download: https://intrusion-detection.distrinet-research.be/WTMC2021/Dataset/dataset.zip
      paper_link: https://downloads.distrinet-research.be/WTMC2021  # cited in paper p.6; 301-redirects to landing_page
      tools_page: https://intrusion-detection.distrinet-research.be/WTMC2021/tools_datasets.html
      fixed_extractor: https://github.com/GintsEngelen/CICFlowMeter
    version: >
      WTMC2021 release with page-logged updates 20/10/2021 (reupload),
      22/10/2021 (CICFlowMeter fix, CSVs regenerated), 24/11/2021 (Down/Up
      ratio fix, CSVs regenerated).
    superseded_notice: >
      Landing page (update 18/11/2022) points to a newer version at
      https://intrusion-detection.distrinet-research.be/CNS2022/index.html .
      NOT adopted. Using it would be an alternative corrected dataset: decision
      D-004 required before either version is downloaded.
    files:
      - name: dataset.zip
        size_bytes: null
        sha256: null
        confirmed: link only; contents, size and per-day CSV names UNCONFIRMED
    license: UNCONFIRMED (no license text on pages checked). Page asks users to cite the paper.
    citation: >
      G. Engelen, V. Rimmer, W. Joosen, "Troubleshooting an Intrusion Detection
      Dataset: the CICIDS2017 Case Study", IEEE SPW 2021, pp. 7-12,
      doi:10.1109/SPW53761.2021.00009.
    records:
      value: null
      landing_page_label_table: >
        Effective / attempted counts listed per class (e.g. BENIGN 1,657,069;
        DoS Hulk 158,469 / 579 attempted; PortScan 159,023; DDoS 95,123).
        Attempted total stated as 9,103. Effective sum 2,090,918 (our sum, not
        stated on page). Counts exclude corrupted and NaN-feature rows.
    feature_schema:
      count: null
      notes: >
        Regenerated with a modified CICFlowMeter, so the column set may differ
        from the original release. Original<->corrected column alignment is
        D-005, not assumed.
      confirmed: false
    labeling:
      columns: null
      scheme: 'Original class names plus "<class> - Attempted" for payload-reliant attacks whose flows carry no payload'
      notes: >
        Rows are re-extracted from PCAP, so there is no row-level key linking
        them to the original CSV. Label changes can only be compared at
        flow-tuple/time level (D-005).
    split_policy: undecided
    intended_experiments:
      - R4a evaluation target for CICIDS2017-original-trained models
      - corrected-data retraining (separate question from cross-domain transfer)
      - per-class error analysis of "Attempted" flows

  # ---------------------------------------------------------------------------
  unsw_nb15:
    name: UNSW-NB15 (Argus/Bro CSV release)
    status: not_acquired
    local_dir: data/raw/unsw_nb15
    publisher: UNSW Canberra Cyber (Moustafa & Slay)
    official_source:
      landing_page: https://research.unsw.edu.au/projects/unsw-nb15-dataset
      download: UNSW SharePoint folder linked as "HERE" from the landing page
      access_notes: >
        SharePoint link returned HTTP 403 to automated fetch on 2026-11-07;
        must be opened manually in a browser. Landing page last updated
        02 June 2021.
    version: null
    files:
      - {name: UNSW-NB15_1.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_2.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_3.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_4.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_features.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_GT.csv, size_bytes: null, sha256: null}
      - {name: UNSW-NB15_LIST_EVENTS.csv, size_bytes: null, sha256: null}
      - {name: UNSW_NB15_training-set.csv, size_bytes: null, sha256: null}
      - {name: UNSW_NB15_testing-set.csv, size_bytes: null, sha256: null}
    license: >
      "Free use ... for academic research purposes is hereby granted in
      perpetuity"; commercial use must be agreed with the authors.
    citation: >
      N. Moustafa, J. Slay, "UNSW-NB15: a comprehensive data set for network
      intrusion detection systems", MilCIS 2015 (page lists further required
      citations).
    records:
      full_csvs: 2540044        # landing page
      training_set: 175341      # landing page
      testing_set: 82332        # landing page
      paper_reported:
        - >
          Fang et al. [3]: Normal-vs-DoS subset 92,998 normal / 16,353 DoS;
          train 55,998 + 12,264, test 37,000 + 4,089 (p.22). These counts look
          close to the official training/testing-set partition rather than a
          70/30 stratified split (hypothesis, D-009).
    feature_schema:
      count: 49  # "49 features with the class label" (landing page)
      paper_reported: ["Fang et al. [3]: 47 feature types"]
      notes: >
        The full CSVs have no header row (column names in UNSW-NB15_features.csv,
        UNCONFIRMED). The training/testing-set CSVs use a different, reduced
        column set. Categorical: proto, service, state (Phase II / Fang).
      identifier_fields_expected: [srcip, sport, dstip, dsport, stime, ltime]
      confirmed: false
    labeling:
      columns: null  # expected label (0/1) and attack_cat; UNCONFIRMED
      classes: [Normal, Fuzzers, Analysis, Backdoors, DoS, Exploits, Generic, Reconnaissance, Shellcode, Worms]
      notes: >
        Fang [3] defines normal as the positive class and DoS as the negative
        class (p.14). Metric polarity must be explicit when comparing.
    split_policy: undecided
    intended_experiments:
      - Fang SHAP-DCNN baseline reproduction (Normal vs DoS scope, D-009)
      - SHAP + ARR@K audit; UNSW artifact candidates are hypotheses only
      - R4b cross-domain source/target, only if D-006 is resolved

  # ---------------------------------------------------------------------------
  nf_unsw_nb15_v2:
    name: NF-UNSW-NB15-v2 (UQ NetFlow v2 feature set)
    status: not_acquired
    local_dir: data/raw/nf_unsw_nb15_v2
    publisher: University of Queensland (Sarhan, Layeghy, Portmann)
    official_source:
      landing_page: https://staff.itee.uq.edu.au/marius/NIDS_datasets/
      download: https://rdm.uq.edu.au/files/8c6e2a00-ef9c-11ed-827d-e762de186848
      access_notes: >
        RDM file page is JavaScript-rendered; automated fetch returned an empty
        body. File name, size and DOI UNCONFIRMED. Do not confuse with
        NF-UNSW-NB15 (v1, 1,623,118 flows), NF-UNSW-NB15-v3 (53 features) or
        CIC-UNSW-NB15 on the same page.
    version: v2
    files:
      - {name: null, size_bytes: null, sha256: null, confirmed: false}
    license: UNCONFIRMED (no dataset license on landing page; CC BY 4.0 is NOT confirmed)
    citation: >
      M. Sarhan, S. Layeghy, M. Portmann, "Towards a Standard Feature Set for
      Network Intrusion Detection System Datasets", Mobile Networks and
      Applications, 2022, doi:10.1007/s11036-021-01843-0. (The landing page
      prose and BibTeX disagree on volume/pages.)
    records:
      total: 2390275    # landing page
      attack: 95053     # landing page (3.98%)
      benign: 2295222   # landing page
      attack_classes: {Fuzzers: 22310, Analysis: 2299, Backdoor: 2169, DoS: 5794, Exploits: 31551, Generic: 16560, Reconnaissance: 12779, Shellcode: 1427, Worms: 164}
      paper_reported:
        - >
          Wardana et al. [2] Table 3 (p.5): N1 NF-UNSW-NB15 normal 1,911,666 /
          anomalous 75,079 (sum 1,986,745), which does not match the official
          totals above. No filtering step is described (D-001).
    feature_schema:
      count: 43  # "43 extended NetFlow features" (landing page)
      paper_reported:
        - "Wardana [2] p.5: 45 fields, 40 used. Table 2 lists 39 fields + Label. Table 6: input dimension 39."
      wardana_table2_inputs: [PROTOCOL, L7_PROTO, IN_BYTES, IN_PKTS, OUT_BYTES, OUT_PKTS, TCP_FLAGS, CLIENT_TCP_FLAGS, SERVER_TCP_FLAGS, FLOW_DURATION_MILLISECONDS, DURATION_IN, DURATION_OUT, MIN_TTL, MAX_TTL, LONGEST_FLOW_PKT, SHORTEST_FLOW_PKT, MIN_IP_PKT_LEN, MAX_IP_PKT_LEN, SRC_TO_DST_SECOND_BYTES, DST_TO_SRC_SECOND_BYTES, RETRANSMITTED_IN_BYTES, RETRANSMITTED_IN_PKTS, RETRANSMITTED_OUT_BYTES, RETRANSMITTED_OUT_PKTS, SRC_TO_DST_AVG_THROUGHPUT, DST_TO_SRC_AVG_THROUGHPUT, NUM_PKTS_UP_TO_128_BYTES, NUM_PKTS_128_TO_256_BYTES, NUM_PKTS_256_TO_512_BYTES, NUM_PKTS_512_TO_1024_BYTES, NUM_PKTS_1024_TO_1514_BYTES, TCP_WIN_MAX_IN, TCP_WIN_MAX_OUT, ICMP_TYPE, ICMP_IPV4_TYPE, DNS_QUERY_ID, DNS_QUERY_TYPE, DNS_TTL_ANSWER, FTP_COMMAND_RET_CODE]
      identifier_fields_expected: [IPV4_SRC_ADDR, L4_SRC_PORT, IPV4_DST_ADDR, L4_DST_PORT]
      confirmed: false
    labeling:
      columns: null  # expected Label (binary) and Attack (class); UNCONFIRMED
      notes: Wardana uses binary normal/anomaly only.
    split_policy: undecided
    intended_experiments:
      - MES-DNN baseline (Wardana) single-network component; full 5-network
        scenario needs NF-ToN-IoT-v2, NF-BoT-IoT-v2, NF-CSE-CIC-IDS2018-v2 and
        NF-UQ-NIDS-v2 (~150M flows combined), NOT in this manifest (D-010)
      - same-traffic schema comparison against UNSW-NB15 (D-006)
