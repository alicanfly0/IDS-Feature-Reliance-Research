# Dataset acquisition manifest (Milestone 0).
#
# Rules:
#  - Only the official source listed here may be used. Mirrors (Kaggle, Hugging
#    Face, GitHub re-uploads) and alternative "corrected" versions are NOT
#    substitutes. Any change of source is a decision-log entry first.
#  - `null` means unknown. Every value carries its evidence in `source` /
#    `confirmed`. "UNCONFIRMED" values must be checked against downloaded files.
#  - sha256 fields come from our own downloads on 2026-11-07 and are the
#    reference for every later run (`python -m src.data.acquire verify all`).
#    Where a publisher ships its own checksum (CIC .md5 files, UQ BagIt
#    sha1 manifest) it was checked as well and is recorded as publisher_*.
#  - status: verified = every listed file present and hash-recorded;
#    not_acquired = nothing downloaded yet.
#  - Facts measured from the files are in `measured:` blocks; inspection
#    reports are in results/inspection/.
#
# Web pages were checked on 2026-11-07. Paper facts cite PDFs in ../project/
# (physical page numbers) as audited in CNET_FULL_PAPER_AUDIT.md.

manifest_version: 1
checked_on: 2026-11-07

datasets:

  # ---------------------------------------------------------------------------
  cicids2017_original:
    name: CIC-IDS2017 (original CICFlowMeter CSV release)
    status: verified
    local_dir: data/raw/cicids2017_original
    publisher: Canadian Institute for Cybersecurity, University of New Brunswick
    official_source:
      landing_page: https://www.unb.ca/cic/datasets/ids-2017.html
      download: http://cicresearch.ca/CICDataset/CIC-IDS-2017/
      access_notes: >
        Download page (now https) is a registration form: first/last name,
        email, organization, job title, country. After submitting, a session
        cookie unlocks browse.php -> CIC-IDS-2017/CSVs/ (MachineLearningCSV.zip,
        GeneratedLabelledFlows.zip, each with a publisher .md5) and
        CIC-IDS-2017/PCAPs/. The server sends no Content-Length. Downloaded
        2026-11-07 after registering (registrant details deliberately not recorded).
    version: null  # no version identifier or DOI published on the landing page
    files:
      - name: MachineLearningCSV.zip
        purpose: CICFlowMeter features + label, identifiers removed
        size_bytes: 235102953
        sha256: c3f26274b36c837ccf28ffd2dbf4582941c30b3ee70a635c6e5b2f87c4727928
        publisher_md5: 4f83860afbf29cac8163854095bf6cf7  # verified; CIC's .md5 names it "MachineLearningCVE.zip"
        extract_to: extracted   # unpacks to extracted/MachineLearningCVE/<8 day CSVs>
        download: &cic_form {method: manual, instructions: "submit the registration form at https://cicresearch.ca/CICDataset/CIC-IDS-2017/, open CIC-IDS-2017/CSVs/ and save the file into data/raw/cicids2017_original/"}
      - name: GeneratedLabelledFlows.zip
        purpose: labelled flows incl. Flow ID / IPs / ports / timestamp
        size_bytes: 283876488
        sha256: 7bdbef286f8893f31c6db12105fa097fa5c2dcc6733179037a08129d150ea27a
        publisher_md5: 5ca3f8f69e3514950681615824149973  # verified
        extract_to: extracted   # zip folder "TrafficLabelling " (trailing space) is written as extracted/TrafficLabelling/
        download: *cic_form
    not_downloaded:
      - name: PCAPs (per day, CIC-IDS-2017/PCAPs/ on the download server)
        reason: only needed to re-extract flows ourselves
        size_note: "Landing page table 'Size (GB)': Mon 11.0, Tue 11, Wed 13, Thu 7.8, Fri 8.3 (not stated whether PCAP-only)"
    license: >
      No named license. Page says the dataset is publicly available for
      researchers and users should cite the related paper. Redistribution terms
      UNCONFIRMED: do not re-host.
    citation: >
      I. Sharafaldin, A. H. Lashkari, A. A. Ghorbani, "Toward Generating a New
      Intrusion Detection Dataset and Intrusion Traffic Characterization",
      ICISSP 2018.
    records:
      value: 2830743   # measured: sum of the 8 MachineLearningCVE day files
      notes: >
        Matches the "2.83 million" in Phase II, but Phase II attributes it to
        [1]; [1] uses only the 225,745-row Friday-afternoon DDoS file (D-008).
      measured_per_file:   # MachineLearningCVE/*.csv
        Monday-WorkingHours: 529918
        Tuesday-WorkingHours: 445909
        Wednesday-workingHours: 692703
        Thursday-WorkingHours-Morning-WebAttacks: 170366
        Thursday-WorkingHours-Afternoon-Infilteration: 288602
        Friday-WorkingHours-Morning: 191033
        Friday-WorkingHours-Afternoon-PortScan: 286467
        Friday-WorkingHours-Afternoon-DDos: 225745   # = Nezhadsistani [1] subset size; 128,027 DDoS / 97,718 BENIGN
    feature_schema:
      count: 78   # measured: 79 columns = 78 features + Label (MachineLearningCVE)
      source: measured; landing page says "more than 80 network flow features"
      paper_reported:
        - "Nezhadsistani et al. [1]: 78 features + label in the DDoS subset (Table 3); matches"
      measured_quirks:
        - leading whitespace on 65 of 79 column names
        - '"Fwd Header Length" appears twice (second read as "Fwd Header Length.1")'
        - 'Infinity in Flow Bytes/s (1,509) and Flow Packets/s (2,867); NaN in Flow Bytes/s'
        - 'labels contain U+FFFD literally ("Web Attack � Brute Force"); the original dash was lost before release'
        - 'Init_Win_bytes_forward/backward = -1 in 1,001,189 / 1,441,552 rows (sentinel, not a window size)'
        - negative Flow Duration (115 rows), Fwd Header Length and min_seg_size_forward (35 rows)
        - 'constant in every day file: Bwd PSH Flags, Bwd URG Flags, Fwd/Bwd Avg Bytes/Bulk, Fwd/Bwd Avg Packets/Bulk, Fwd/Bwd Avg Bulk Rate (Fwd URG Flags is NOT constant, contrary to Phase II)'
      identifier_fields: >
        MachineLearningCVE contains only Destination Port. TrafficLabelling
        (GeneratedLabelledFlows.zip) has 85 columns: Flow ID, Source IP,
        Source Port, Destination IP, Destination Port, Protocol, Timestamp +
        the same 77 remaining features + Label; see results/inspection/cic2017_glf_*.
      traffic_labelling_quirks:
        - 'Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv is cp1252 (labels use a real en dash) and has 458,968 rows of which 288,602 are completely empty; 170,366 real rows, as in MachineLearningCVE'
        - other 7 files are UTF-8 with BOM; real row counts equal MachineLearningCVE file by file (total 2,830,743)
      confirmed: true
    labeling:
      columns: [Label]
      measured_counts: {BENIGN: 2273097, DoS Hulk: 231073, PortScan: 158930, DDoS: 128027, DoS GoldenEye: 10293, FTP-Patator: 7938, SSH-Patator: 5897, DoS slowloris: 5796, DoS Slowhttptest: 5499, Bot: 1966, "Web Attack � Brute Force": 1507, "Web Attack � XSS": 652, Infiltration: 36, "Web Attack � Sql Injection": 21, Heartbleed: 11}
      classes_from_landing_page: >
        BENIGN plus Brute Force FTP/SSH, DoS (slowloris, Slowhttptest, Hulk,
        GoldenEye), Heartbleed, Web Attack (Brute Force, XSS, SQL Injection),
        Infiltration, Botnet (ARES), PortScan, DDoS (LOIT)
      known_label_issues: >
        Engelen 2021 [10]: TCP appendices (25.9% of flows), over-broad labels,
        payload-less "attempted" attacks labelled as attacks. Lanvin 2023 [11]:
        ~5% duplicated packets, port scan during Thursday infiltration unlabelled.
    split_policy: undecided  # see docs/decision_log.md D-007
    intended_experiments:
      - R1 full-feature baselines (AE-XGBoost scope per D-008)
      - R2 metadata-stripped and R3 extraction-bug-stripped retrained ablations
      - SHAP + ARR@K attribution audit
      - R4a source domain for train-original / test-corrected evaluation (D-005)

