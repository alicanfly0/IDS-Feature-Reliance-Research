  cicids2017_engelen_wtmc2021:
    name: CICIDS2017 regenerated by Engelen, Rimmer & Joosen (WTMC 2021)
    status: verified
    local_dir: data/raw/cicids2017_engelen_wtmc2021
    publisher: DistriNet, KU Leuven
    official_source:
      landing_page: https://intrusion-detection.distrinet-research.be/WTMC2021/
      download: https://intrusion-detection.distrinet-research.be/WTMC2021/Dataset/dataset.zip
      paper_link: https://downloads.distrinet-research.be/WTMC2021  # cited in paper p.6; 301-redirects to landing_page
      tools_page: https://intrusion-detection.distrinet-research.be/WTMC2021/tools_datasets.html
      fixed_extractor: https://github.com/GintsEngelen/CICFlowMeter
    version: >
      WTMC2021 release with page-logged updates 20/10/2021 (reupload),
      22/10/2021 (CICFlowMeter fix, CSVs regenerated), 24/11/2021 (Down/Up
      ratio fix, CSVs regenerated).
    superseded_notice: >
      Landing page (update 18/11/2022) points to a newer version at
      https://intrusion-detection.distrinet-research.be/CNS2022/index.html .
      NOT adopted and not downloaded. Using it would be an alternative
      corrected dataset (D-004). The WTMC2021 version named in the project
      specification is the one downloaded.
    files:
      - name: dataset.zip
        size_bytes: 333841436   # HTTP Content-Length, Last-Modified 2021-11-24
        sha256: 4d535da19795d85376ae1397d161329e3b06fc47d9a5a68cd9be2cd7ecee0f2a   # all zip member CRCs verified
        extract_to: extracted   # 5 files: <Day>-WorkingHours.csv, Monday..Friday
        download:
          method: direct   # server is slow (~80 KB/s per connection); expect about an hour
          url: https://intrusion-detection.distrinet-research.be/WTMC2021/Dataset/dataset.zip
    license: UNCONFIRMED (no license text on the landing or tools pages, nor in dataset.zip). Page asks users to cite the paper. Do not re-host.
    citation: >
      G. Engelen, V. Rimmer, W. Joosen, "Troubleshooting an Intrusion Detection
      Dataset: the CICIDS2017 Case Study", IEEE SPW 2021, pp. 7-12,
      doi:10.1109/SPW53761.2021.00009.
    records:
      value: 2100814   # measured, 5 day files; 25.8% fewer than the original 2,830,743
      measured_per_file: {Monday: 371749, Tuesday: 322003, Wednesday: 496779, Thursday: 362368, Friday: 547915}
      landing_page_label_table: >
        Effective / attempted counts listed per class (e.g. BENIGN 1,657,069;
        DoS Hulk 158,469 / 579 attempted; PortScan 159,023; DDoS 95,123).
        Attempted total stated as 9,103. Effective sum 2,090,918 (our sum, not
        stated on page). Counts exclude corrupted and NaN-feature rows.
      reconciliation: >
        The files contain 793 rows with Infinity or NaN features (624 BENIGN,
        128 PortScan, 25 DoS slowloris - Attempted, 14 DoS Hulk - Attempted,
        2 DoS Slowhttptest - Attempted). Measured counts minus these rows equal
        the landing-page table class by class.
    feature_schema:
      count: 77   # measured: 84 columns = 6 identifiers (Flow ID, Src IP, Src Port, Dst IP, Dst Port, Timestamp) + 77 features incl. Protocol + Label; TrafficLabelling layout minus its duplicated Fwd Header Length
      notes: >
        No BOM, no padded column names, no duplicated column. Many columns are
        RENAMED relative to the original release, e.g. Source IP -> Src IP,
        Total Fwd Packets -> Total Fwd Packet, Init_Win_bytes_forward ->
        FWD Init Win Bytes, min_seg_size_forward -> Fwd Seg Size Min,
        Fwd Avg Bytes/Bulk -> Fwd Bytes/Bulk Avg. An explicit original<->corrected
        column map is required (D-005); do not align by position.
      measured_quirks:
        - 'Infinity in Flow Bytes/s (191) and Flow Packets/s (793); NaN in Flow Bytes/s (602) and Flow IAT Mean/Std/Max/Min (252)'
        - 'negative Flow IAT Min (2,922 rows), Flow Duration / Flow IAT Mean / Max (31)'
        - no column is constant in every day file (unlike the original release)
        - 'content duplicates per day: 3.9% (Wed) to 32.4% (Fri); Friday has 596 feature vectors with conflicting labels'
      identifier_fields: [Flow ID, Src IP, Src Port, Dst IP, Dst Port, Timestamp]
      confirmed: true
    labeling:
      columns: [Label]
      measured_counts: {BENIGN: 1657693, PortScan: 159151, DoS Hulk: 158469, DDoS: 95123, DoS GoldenEye: 7567, DoS slowloris: 4001, FTP-Patator: 3973, DoS Slowhttptest - Attempted: 3369, SSH-Patator: 2980, DoS Slowhttptest: 1742, DoS slowloris - Attempted: 1731, Bot - Attempted: 1470, Web Attack - Brute Force - Attempted: 1214, Bot: 738, Web Attack - XSS - Attempted: 652, DoS Hulk - Attempted: 593, Web Attack - Brute Force: 151, DoS GoldenEye - Attempted: 80, Infiltration: 32, Web Attack - XSS: 27, Infiltration - Attempted: 16, Web Attack - Sql Injection: 12, FTP-Patator - Attempted: 11, Heartbleed: 11, SSH-Patator - Attempted: 8}
      scheme: 'Original class names plus "<class> - Attempted" for payload-reliant attacks whose flows carry no payload (25 labels; plain ASCII hyphens)'
      notes: >
        Rows are re-extracted from PCAP, so there is no row-level key linking
        them to the original CSV. Label changes can only be compared at
        flow-tuple/time level (D-005).
    split_policy: undecided
    intended_experiments:
      - R4a evaluation target for CICIDS2017-original-trained models
      - corrected-data retraining (separate question from cross-domain transfer)
      - per-class error analysis of "Attempted" flows

