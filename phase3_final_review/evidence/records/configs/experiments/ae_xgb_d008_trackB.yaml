# AE-XGBoost baseline, D-008 scope (CICIDS2017 Friday-afternoon DDoS), D-007 track B
# (leakage-resistant, duplicate-aware split). First real run: one model seed, on Colab GPU.
# Every value is either from Nezhadsistani et al. 2026 or a labelled adaptation (D-017).
#   python -m src.experiments.ae_xgb --config configs/experiments/ae_xgb_d008_trackB.yaml --device cuda --storage <dir>

experiment:
  name: ae_xgb_d008_trackB
  dataset: cicids2017_original
  files: {data: MachineLearningCSV.zip}   # member: MachineLearningCVE/Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
  label: Label
  label_cols: [Label]
  identifier_cols: []        # Destination Port deliberately RETAINED as a candidate shortcut (D-012)
  categorical_cols: []       # all 78 features are numeric
  split:
    strategy: group          # content groups: identical feature vectors stay in one partition
    fractions: [0.70, 0.15, 0.15]
    seed: 42
    expected_fingerprint: 50bd994880abbe151738993e299b90a6e50fb5ffae235a72677bb7813c447f44

data:
  label_map: {BENIGN: 0, DDoS: 1}      # DDoS = positive class (D-008)
  nonnegative_cols: [Flow Duration]    # D-011 rules: + any missing, + any infinite

ae:                          # paper §4.2.1 unless marked
  hidden: [80]               # paper: 120 -> 80 -> 40; input width adapted (D-003)
  latent: 40
  activation: relu           # paper: ReLU "in all layers"
  latent_activation: relu
  output_activation: linear  # ADAPTATION: output activation not specified
  lr: 0.001
  batch_size: 256
  max_epochs: 100            # paper: "stabilize in 50-100 epochs"
  patience: 10               # ADAPTATION: patience not specified
  min_delta: 0.0

augment:                     # paper §3.3, Eq. 4 (minority-class attacks only)
  enabled: false             # DDoS is the MAJORITY class here, so the paper's rule selects nothing (D-017)
  sigma_scale: 0.1           # ADAPTATION (sigma not specified)
  keep_quantile: 0.95        # ADAPTATION (acceptance threshold not specified)

xgb:                         # paper Table 5 ranges; selected values not reported -> fixed a priori (D-017)
  n_estimators: 2000         # upper bound; trees chosen by validation early stopping
  learning_rate: 0.11        # on the paper's 0.01-0.30 step-0.05 grid
  max_depth: 6               # paper: capped at 6
  reg_alpha: 0
  reg_lambda: 1
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50  # on the validation partition only

run:
  model_seed: 0
  device: cuda               # fails fast if no GPU; use --device cpu deliberately for CPU
  threshold: 0.5             # fixed a priori; never tuned on test
  sample: null
