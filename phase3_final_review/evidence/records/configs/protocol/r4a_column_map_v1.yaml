# PROPOSED (D-005, not approved) R4a column map v1: original CICIDS2017 MachineLearningCVE name -> Engelen
# WTMC2021 Friday-WorkingHours.csv name. Hand-written from both headers on 2026-11-11 and checked by
# scripts/audit_r4a_feasibility.py (coverage, distributions). A shared name does NOT imply an identical
# definition: see `definition_changes` and docs/MILESTONE_3B0_READINESS.md §4.
version: 1
status: PROPOSED
