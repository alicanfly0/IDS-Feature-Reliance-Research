unused_engelen_columns: [Flow ID, Src IP, Src Port, Dst IP, Protocol, Timestamp]   # not original model inputs
definition_changes:   # documented by Engelen et al., extended documentation (sections named)
  - columns: [FIN Flag Count, SYN Flag Count, RST Flag Count, PSH Flag Count, ACK Flag Count, URG Flag Count, ECE Flag Count]
    source: "CICIDS2017 and CICFlowMeter tool / TCP flag count"
    change: "original counts only the first packet (values 0/1); corrected counts every packet"
  - columns: [Fwd PSH Flags, Bwd PSH Flags, Fwd URG Flags, Bwd URG Flags]
    source: "CICIDS2017 and CICFlowMeter tool / TCP flag count"
    change: "original increments incorrect; fixed in the corrected tool"
  - columns: [Fwd Header Length.1]
    source: "Duplicate Fwd Header Length"
    change: "duplicate removed in the corrected data; fed from Fwd Header Length"
  - columns: ALL
    source: "Flow Construction / Timeout & TCP Appendices; Labelling"
    change: "flows re-segmented (FIN/RST/appendix handling) and labels re-assigned with tuned windows (DDoS 03:40-04:30 PM); no row correspondence"
