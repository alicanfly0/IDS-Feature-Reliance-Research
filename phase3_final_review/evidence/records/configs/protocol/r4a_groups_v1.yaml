# FROZEN R4a-ii groups and controls (2026-11-12, D-024), generated from the CORRECTED TRAIN partition only,
# before any R4a training, by scripts/freeze_r4a_groups.py (same algorithm as protocol r1; src/audit/groups.py).
# Group membership follows the same mechanisms and rules as r1 but differs in columns, because feature definitions
# and proxy twins differ in the corrected data. Do not edit. Check: .\run.cmd scripts/freeze_r4a_groups.py --check
protocol: R4a-ii (D-024) groups and controls, frozen from the corrected TRAIN partition before any R4a training
generated_from:
